async function carregarCatalogo() {
    const container = document.getElementById('grid-catalogo-completo'); // No catalogo-completo, mude para 'grid-catalogo-completo'
    if (!container) return;

    try {
        const response = await fetch('./data/produtos.json');
        if (!response.ok) throw new Error('Erro ao carregar JSON');
        
        const data = await response.json();
        const lista = Array.isArray(data) ? data : (data.produtos || []);

        if (lista.length === 0) {
            container.innerHTML = '<p class="text-white text-center col-span-full">Nenhuma peça encontrada.</p>';
            return;
        }

        // Para o index.html use .slice(0, 3). No catalogo-completo.html remova o .slice(0, 3)
        const itensParaExibir = window.location.pathname.includes('catalogo') ? lista : lista;

        // O erro está aqui: você deve usar ` (crase) e não ' (aspas)
container.innerHTML = itensParaExibir.map(faca => `
    <div class="group bg-brand-charcoal p-4 rounded-xl border border-white/5">
        <div class="overflow-hidden rounded-lg mb-4">
            <img src="${faca.image}" alt="${faca.title}" class="w-full h-64 object-cover">
        </div>
        <h3 class="font-serif text-xl text-white">${faca.title}</h3>
        <p class="text-gold font-bold mt-2">${faca.price}</p>
        <a href="${faca.link}" class="block mt-4 text-center border border-gold/30 py-2 rounded-full text-xs uppercase tracking-widest hover:bg-gold hover:text-black transition">
            Encomendar
        </a>
    </div>
`).join(''); // Fechamento correto
 // O erro costuma estar por aqui (parêntese do map + join)

    } catch (error) {
        console.error("Erro no carregamento:", error);
        container.innerHTML = '<p class="text-white text-center col-span-full">Erro ao carregar o catálogo.</p>';
    }
}

document.addEventListener('DOMContentLoaded', carregarCatalogo);
